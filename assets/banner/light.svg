<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f0f4ff"/>
      <stop offset="55%"  stop-color="#e8eeff"/>
      <stop offset="100%" stop-color="#ede8ff"/>
    </linearGradient>

    <!-- Animated rainbow gradient for main name -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0055FF">
        <animate attributeName="stop-color" values="#0055FF;#7700DD;#CC0055;#996600;#0055FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7700DD">
        <animate attributeName="stop-color" values="#7700DD;#CC0055;#996600;#0055FF;#7700DD" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#CC0055">
        <animate attributeName="stop-color" values="#CC0055;#996600;#0055FF;#7700DD;#CC0055" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Credential line gradient -->
    <linearGradient id="credGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#7700DD"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0055FF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#0055FF"/>
      <stop offset="70%"  stop-color="#7700DD"/>
      <stop offset="100%" stop-color="#7700DD" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Heavy blur for ambient orbs -->
    <filter id="heavyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" fill="url(#bg)" rx="0"/>

  <!-- Ambient glow orbs -->
  <ellipse cx="130" cy="110" rx="120" ry="70" fill="#0055FF" opacity="0.06" filter="url(#heavyBlur)">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="670" cy="110" rx="120" ry="70" fill="#7700DD" opacity="0.07" filter="url(#heavyBlur)">
    <animate attributeName="opacity" values="0.09;0.04;0.09" dur="5.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===================== TWINKLING PARTICLES ===================== -->
  <circle cx="18"  cy="25"  r="1.5" fill="#0055FF"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="762" cy="185" r="1.5" fill="#7700DD"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="78"  cy="172" r="1.0" fill="#334155" ><animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="722" cy="30"  r="1.2" fill="#0055FF"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="683" cy="160" r="1.0" fill="#334155" ><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="108" cy="48"  r="1.3" fill="#7700DD"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="742" cy="88"  r="1.0" fill="#334155" ><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="43"  cy="200" r="1.5" fill="#0055FF"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="777" cy="120" r="1.2" fill="#7700DD"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="132" cy="208" r="1.0" fill="#334155" ><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="668" cy="205" r="1.3" fill="#0055FF"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="53"  cy="110" r="1.0" fill="#7700DD"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="787" cy="55"  r="1.5" fill="#334155" ><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="698" cy="208" r="1.0" fill="#0055FF"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="28"  cy="140" r="1.2" fill="#7700DD"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="14"  r="1.0" fill="#334155" ><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="205" r="1.2" fill="#0055FF"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="20"  r="1.0" fill="#7700DD"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="20"  r="1.3" fill="#334155" ><animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="170" cy="205" r="1.0" fill="#0055FF"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/></circle>

  <!-- ===================== FLOATING CODE SYMBOLS — LEFT ===================== -->
  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4.0s" repeatCount="indefinite"/>
      <text x="22" y="90" font-family="Courier New,monospace" font-size="22" fill="#0055FF">
        <animate attributeName="opacity" values="0.18;0.40;0.18" dur="4.0s" repeatCount="indefinite"/>
        &lt;/&gt;
      </text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="3.6s" repeatCount="indefinite"/>
      <text x="28" y="165" font-family="Courier New,monospace" font-size="18" fill="#7700DD">
        <animate attributeName="opacity" values="0.16;0.38;0.16" dur="3.6s" repeatCount="indefinite"/>
        &#123; &#125;
      </text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="5.2s" repeatCount="indefinite"/>
      <text x="120" y="38" font-family="Courier New,monospace" font-size="12" fill="#0055FF" letter-spacing="1">
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="6.0s" repeatCount="indefinite"/>
        def train():
      </text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="7.0s" repeatCount="indefinite"/>
      <text x="10" y="205" font-family="Courier New,monospace" font-size="13" fill="#334155">
        <animate attributeName="opacity" values="0.08;0.22;0.08" dur="7.0s" repeatCount="indefinite"/>
        [ ]
      </text>
    </g>
  </g>

  <!-- ===================== FLOATING CODE SYMBOLS — RIGHT ===================== -->
  <g filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="3.9s" repeatCount="indefinite"/>
      <text x="738" y="88" font-family="Courier New,monospace" font-size="22" fill="#7700DD">
        <animate attributeName="opacity" values="0.18;0.40;0.18" dur="3.9s" repeatCount="indefinite"/>
        ( )
      </text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,11;0,0" dur="4.3s" repeatCount="indefinite"/>
      <text x="748" y="165" font-family="Courier New,monospace" font-size="18" fill="#0055FF">
        <animate attributeName="opacity" values="0.16;0.36;0.16" dur="4.3s" repeatCount="indefinite"/>
        //
      </text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="6.5s" repeatCount="indefinite"/>
      <text x="588" y="38" font-family="Courier New,monospace" font-size="12" fill="#7700DD" letter-spacing="1">
        <animate attributeName="opacity" values="0.12;0.28;0.12" dur="6.5s" repeatCount="indefinite"/>
        &lt;animate/&gt;
      </text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="5.0s" repeatCount="indefinite"/>
      <text x="767" y="205" font-family="Courier New,monospace" font-size="15" fill="#334155">
        <animate attributeName="opacity" values="0.08;0.24;0.08" dur="5.0s" repeatCount="indefinite"/>
        #
      </text>
    </g>
  </g>

  <!-- ===================== ACCENT LINES ===================== -->
  <rect x="160" y="28" width="480" height="1.5" fill="url(#lineGrad)" rx="1">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="190" width="480" height="1.5" fill="url(#lineGrad)" rx="1">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="3.0s" repeatCount="indefinite"/>
  </rect>

  <!-- ===================== CENTRAL TEXT ===================== -->
  <!-- Role label -->
  <text x="400" y="72" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#64748b" letter-spacing="5">
    <animate attributeName="opacity" values="0.7;1.0;0.7" dur="4s" repeatCount="indefinite"/>
    ✦  AGENTIC AI  ·  FULL-STACK  ·  ML ENGINEERING  ✦
  </text>

  <!-- Main Name — big animated gradient -->
  <text x="400" y="125" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="50" font-weight="bold" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="3">
    ANSHU NANDI
  </text>

  <!-- Credential line 1 -->
  <text x="400" y="155" text-anchor="middle" font-family="Courier New,monospace" font-size="13" fill="url(#credGrad)" letter-spacing="1">
    <animate attributeName="opacity" values="0.8;1.0;0.8" dur="3.5s" repeatCount="indefinite"/>
    B.Tech CSE @ RCCIIT  ·  Ex-ML Engineer Intern @ Webel
  </text>

  <!-- Credential line 2 -->
  <text x="400" y="177" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#64748b" letter-spacing="2">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="5s" repeatCount="indefinite"/>
    nandi.anshu712@gmail.com  ·  linkedin.com/in/anshu-nandi
  </text>
</svg>
