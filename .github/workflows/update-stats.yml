name: Securely Generate GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Official Stats (Dynamic)
        run: |
          git clone --depth=1 https://github.com/anuraghazra/github-readme-stats.git
          cd github-readme-stats
          sed -i 's/totalCommitContributions,/totalCommitContributions, restrictedContributionsCount,/g' src/fetchers/stats.js
          sed -i 's/stats.totalCommits = user.commits.totalCommitContributions;/stats.totalCommits = user.commits.totalCommitContributions + user.commits.restrictedContributionsCount;/g' src/fetchers/stats.js
          sed -i 's/ownerAffiliations: OWNER, isFork: false/ownerAffiliations: [OWNER, ORGANIZATION_MEMBER, COLLABORATOR]/g' src/fetchers/top-languages.js
          npm ci
          npm install express
          echo 'import express from "express"; import indexHandler from "./api/index.js"; import topLangsHandler from "./api/top-langs.js"; const app = express(); app.get("/api", indexHandler); app.get("/api/top-langs", topLangsHandler); app.listen(9000);' > server.js
          node server.js &
          sleep 10
          echo "TESTING RAW GRAPHQL FOR DEBUGGING:"
          curl -s -H "Authorization: bearer $PAT_1" -X POST -d '{"query":"query{user(login:\"AnshuNandi\"){contributionsCollection{restrictedContributionsCount totalCommitContributions}}}"}' https://api.github.com/graphql
          echo ""
          curl -s "http://localhost:9000/api?username=AnshuNandi&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&count_private=true&hide_rank=true" > ../generated-stats.svg
          curl -s "http://localhost:9000/api/top-langs?username=AnshuNandi&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&count_private=true&hide=jupyter%20notebook,c,cython,c%2B%2B" > ../generated-top-langs.svg
        env:
          PAT_1: ${{ secrets.STATS_TOKEN }}

      - name: Generate Contribution Snake (Private Data)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Generate Streak Stats (Private Data)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=AnshuNandi&theme=tokyonight&hide_border=true&background=0D1117
          path: generated-streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Save images to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "chore: securely update github stats and snake" || exit 0
          git pull --rebase origin main
          git push
