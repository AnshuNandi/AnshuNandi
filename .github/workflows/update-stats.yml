name: Securely Generate GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Metrics Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          user: AnshuNandi
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook, c, cython
          config_display: large

      - name: Generate Contribution Snake (Private Data)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Generate Streak Stats (Private Data)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=AnshuNandi&theme=tokyonight&hide_border=true&background=0D1117
          path: generated-streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Save images to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "chore: securely update github stats and snake" || exit 0
          git push
