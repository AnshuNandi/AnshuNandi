name: Securely Generate GitHub Stats
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:      

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Main Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AnshuNandi&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&count_private=true&include_all_commits=true
          path: generated-stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AnshuNandi&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117
          path: generated-top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate Contribution Snake (Private Data)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-grid-snake.svg
            github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Save images to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "chore: securely update github stats and snake" || exit 0
          git push
